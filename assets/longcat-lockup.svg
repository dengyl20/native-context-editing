<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 402 124" width="402" height="124" role="img" aria-label="LongCat">
  <!--
    One asset, two grounds.

    A transparent logo has to change colour with the page, and every mechanism
    for that (prefers-color-scheme in <picture>, GitHub's #gh-dark-mode-only
    fragments) depends on a renderer that may not implement it - so on some
    surfaces the dark-ground page got the light-ground artwork and the wordmark
    disappeared into the background.

    This lockup carries its own ground instead: a near-black rounded plate with
    the white wordmark and the green mark on it. On a light page it reads as a
    deliberate badge; on a dark page the plate is within a shade of the canvas,
    so it reads as no plate at all. No theme switching, no failure mode.
  -->
